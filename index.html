<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra tài khoản</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .login-card { background: white; padding: 30px; border-radius: 12px; shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0084ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        #message { margin-top: 15px; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Đăng Nhập</h2>
    <input type="text" id="username" placeholder="Tên tài khoản">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button onclick="checkAccount()">Kiểm tra</button>
    <div id="message"></div>
</div>

<script>
    function checkAccount() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('message');

        // Giả sử đây là dữ liệu tài khoản đúng
        const validUser = "admin";
        const validPass = "123456";

        if (user === validUser && pass === validPass) {
            msg.innerHTML = "Đăng nhập thành công! Đang tải file...";
            msg.className = "success";
            // Chuyển hướng đến trang tải file sau 2 giây
            setTimeout(() => {
                window.location.href = "https://your-download-link.com";
            }, 2000);
        } else {
            msg.innerHTML = "Tài khoản hoặc mật khẩu sai!";
            msg.className = "error";
        }
    }
</script>

</body>
</html>
